name: charging-guru

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: charging
      POSTGRES_PASSWORD: charging
      POSTGRES_DB: charging_guru
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charging -d charging_guru"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ../../backend/.env.example
    environment:
      CG_DATABASE_URL: postgresql+asyncpg://charging:charging@db:5432/charging_guru
      CG_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
